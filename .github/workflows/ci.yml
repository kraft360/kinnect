name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs (tags can be moved); Dependabot keeps them up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Formatting matches .prettierrc.json; fix locally with `npm run format`.
      - run: npm run format:check
      # Type-checks the Worker and the web app (tsc + svelte-check).
      - run: npm run check
      # Tests make their own throwaway keys, so no secrets are needed. Wrangler still warns
      # "Missing required secrets" for each test file; that's expected.
      - run: npm test
